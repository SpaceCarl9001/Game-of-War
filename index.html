      ${mode==='ai'?`<fieldset class="levels"><legend>Computer difficulty</legend>
        ${[['easy','Easy','Plays by simple habits'],['normal','Normal','Reads the battle, makes some mistakes'],['hard','Hard','Tracks every clue, plays sharp']]
          .map(([v,t,d])=>`<label class="level"><input type="radio" name="level" value="${v}" ${(saved.level||'normal')===v?'checked':''}><b>${t}</b><span>${d}</span></label>`).join('')}
      </fieldset>`:''}
      <fieldset class="levels tcs"><legend>Time control · each player's clock runs only on their turn, +3 s per move</legend>
        ${[[0,'Off','No clock'],[3,'3 min','Blitz'],[5,'5 min','Quick'],[10,'10 min','Relaxed']]
          .map(([v,t,d])=>`<label class="level"><input type="radio" name="tc" value="${v}" ${(+(saved.tc??0))===v?'checked':''}><b>${t}</b><span>${d}</span></label>`).join('')}
      </fieldset>
      <div class="row"><button class="btn primary" type="submit">${mode==='host'?'Create room':'Start game'}</button><button class="btn" type="button" data-act="menu">Back</button></div>
    </form>`,false,'names');
}
function submitNames(form){
  const mode=form.dataset.mode,el=form.elements;
  const n0=cleanName(el.n0.value)||SIDE[0];
  const tc=[0,3,5,10].includes(+(el.tc&&el.tc.value))?+el.tc.value:0;
  rememberNames({tc});
  if(mode==='local'){
    const n1=cleanName(el.n1.value)||SIDE[1];
    rememberNames({local0:n0,local1:n1});
    return newGame('local',[n0,n1],null,tc);
  }
  if(n0!==SIDE[0])rememberNames({me:n0});
  if(mode==='ai'){
    const level=['easy','normal','hard'].includes(el.level&&el.level.value)?el.level.value:'normal';
    rememberNames({level});
    return newGame('ai',[n0,'Computer'],level,tc);
  }
  NET.myName=n0;NET.tc=tc;hostGame();
}

/* ---------- game lifecycle ---------- */
function newGame(mode,names,level,tcMinutes){
  netClose();
  if(S)clearInterval(S.timer);
  S=freshState(mode);
  if(names)S.names=names;
  if(level)S.aiLevel=level;
  S.tc=makeClock(tcMinutes||0);
  EMO.open=false;
  formation(0);formation(1);
  if(mode==='ai'&&AI_LEVELS[S.aiLevel]&&AI_LEVELS[S.aiLevel].smartSetup)aiFormation(1);
  closeOverlay();
  if(mode==='ai'){S.ready[1]=true;beginSetup(0)}
  else showHandoff(0,'setup');
}

function act(a){
  if(a.startsWith('emote:'))return sendEmote(+a.slice(6));
  switch(a){
    case'emotes':EMO.open=!EMO.open;renderPanel();break;
    case'premove-cancel':S.premove=null;S.selected=null;render();break;
    case'ai':case'local':showNames(a);break;
    case'again':
      if(S.mode!=='online')showNames(S.mode);
      else if(NET.role==='host')newOnlineGame();
      else{send({type:'rematch'});toast('Rematch requested. Starting as soon as the host gets it.','info')}
      break;
    case'host':showNames('host');break;
    case'join':showJoin('','');break;
    case'rejoin':joinGame(NET.lastCode,NET.myName);break;
    case'leave':leaveOnline();break;
    case'copy':copyText(NET.code,'Room code copied.');break;
    case'share':shareInvite();break;
    case'menu':showMenu();break;
    case'review':closeOverlay();break;
    case'restore':resumeSaved();break;
    case'resume':
      if(S.handoff)showHandoff(S.handoff.p,S.handoff.kind);else closeOverlay();
      break;
    case'handoff':{
      const h=S.handoff;if(!h)break;
      S.handoff=null;closeOverlay();
      if(h.kind==='setup')beginSetup(h.p);
      else{tcResume();render();S.pending[h.p].forEach(r=>toast(r.text,r.kind));S.pending[h.p]=[]}
      break;}
    case'shuffle':
      if(S.phase!=='setup'||S.ready[viewer()])break;
      formation(viewer());S.preview=null;
      if(S.mode==='online'&&NET.role==='guest')sendArrange();
      render();break;
    case'ready':
      if(S.phase!=='setup'||S.ready[viewer()])break;
      if(S.mode==='online'&&NET.role==='guest'){sendArrange();send({type:'ready'});S.ready[S.me]=true;S.preview=null;render()}
      else markReady(viewer());
      break;
    case'barH':case'barV':case'air':
      if(!isHumanTurn())break;
      S.tool=S.tool===a?'move':a;S.preview=null;S.selected=null;render();break;
    case'cancel':S.tool='move';S.preview=null;render();break;
    case'surrender':if(S.phase==='play')askSurrender();break;
    case'surrender-yes':
      closeOverlay();
      if(S.phase!=='play')break;
      if(S.mode==='online'&&NET.role==='guest'){send({type:'surrender'});S.busy=true;render();toast('Surrender sent.','info')}
      else surrender(meSide());
      break;
    case'keep':closeOverlay();break;
  }
}

function playClick(x,y){
  if(!isHumanTurn()){if(canPremove())premoveClick(x,y);return}
  const me=S.turn,v=viewer();
  if(S.tool==='barH'||S.tool==='barV'){
    const cells=barCells(x,y,S.tool,v);
    if(!validBar(cells)){S.preview=null;render();toast('A barricade needs two empty squares inside the board.','info');return}
    if(S.preview&&S.preview.x===x&&S.preview.y===y){const tool=S.tool;S.tool='move';S.preview=null;commit({type:'bar',cells,tool});return}
    S.preview={x,y};render();return;
  }
  if(S.tool==='air'){
    const t=pieceAt(x,y),onBar=!!barAt(x,y);
    if(!onBar&&(!t||t.owner===me)){toast('Pick an enemy piece or a barricade square to strike.','info');return}
    if(S.preview&&S.preview.x===x&&S.preview.y===y){S.tool='move';S.preview=null;commit(onBar?{type:'air',x,y}:{type:'air',id:t.id});return}
    S.preview={x,y};render();return;
  }
  const p=pieceAt(x,y);
  if(S.selected){
    const sp=getPiece(S.selected);
    if(legalMoves(sp).some(m=>m.x===x&&m.y===y)){S.selected=null;commit({type:'move',id:sp.id,x,y});return}
  }
  if(p&&p.owner===me&&S.selected!==p.id){
    if(!legalMoves(p).length)toast('That piece is boxed in and cannot move.','info');
    S.selected=p.id;snd('select');
  }else S.selected=null;
  render();
}

$('#board').addEventListener('click',e=>{
  const b=e.target.closest('.sq');if(!b)return;
  const x=+b.dataset.x,y=+b.dataset.y;
  if(S.phase==='setup'&&!S.handoff)setupClick(x,y);
  else if(S.phase==='play')playClick(x,y);
});
$('#board').addEventListener('mouseover',e=>{
  document.querySelectorAll('.sq.hov').forEach(n=>n.classList.remove('hov'));
  if(!isHumanTurn()||(S.tool!=='barH'&&S.tool!=='barV')||S.preview)return;
  const b=e.target.closest('.sq');if(!b)return;
  const cells=barCells(+b.dataset.x,+b.dataset.y,S.tool,viewer());
  if(!validBar(cells))return;
  cells.forEach(c=>{const n=document.querySelector(`.sq[data-x="${c.x}"][data-y="${c.y}"]`);if(n)n.classList.add('hov')});
});
$('#board').addEventListener('mouseleave',()=>document.querySelectorAll('.sq.hov').forEach(n=>n.classList.remove('hov')));
$('#panel').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)act(b.dataset.act)});
$('#panel').addEventListener('change',e=>{
  const t=e.target.closest('[data-pref]');if(!t)return;
  setPref(t.dataset.pref,t.checked);
  if(t.dataset.pref==='premove'&&!t.checked){S.premove=null;render()}
});
$('#card').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)act(b.dataset.act)});
$('#menuBtn').addEventListener('click',showMenu);
$('#soundBtn').addEventListener('click',()=>setMuted(!SND.muted));
{const b=$('#soundBtn');b.setAttribute('aria-pressed',String(!SND.muted));b.setAttribute('aria-label',SND.muted?'Sound off':'Sound on');b.classList.toggle('off',SND.muted)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.phase==='play'&&S.tool!=='move'){act('cancel')}});

/* ---------- applying orders (shared by every mode; the online host also uses it to check the guest's orders) ---------- */
function applyAction(owner,a){
  if(S.phase!=='play'||S.turn!==owner||!a)return false;
  const sk=S.skills[owner];
  if(a.type==='bar'){
    const tool=a.tool,c=a.cells;
    if(S.barUsed||!(tool==='barH'&&sk.h>0||tool==='barV'&&sk.v>0)||!Array.isArray(c)||c.length!==2)return false;
    const cells=c.map(q=>({x:q&&q.x,y:q&&q.y}));
    if(!cells.every(q=>Number.isInteger(q.x)&&Number.isInteger(q.y)))return false;
    const dx=Math.abs(cells[1].x-cells[0].x),dy=Math.abs(cells[1].y-cells[0].y);
    if(tool==='barH'?!(dx===1&&dy===0):!(dx===0&&dy===1))return false;
    if(!validBar(cells))return false;
    placeBarricade(owner,cells,tool);render();return true;
  }
  if(a.type==='air'){
    if(!sk.air)return false;
    if(a.id!=null){
      const t=getPiece(a.id);
      if(!t||!t.alive||t.owner===owner)return false;
      airStrike(owner,t);
    }else{
      if(!Number.isInteger(a.x)||!Number.isInteger(a.y)||!barAt(a.x,a.y))return false;
      airStrikeBar(owner,a.x,a.y);
    }
    endTurn();return true;
  }
  if(a.type==='move'){
    const p=getPiece(a.id);
    if(!p||!p.alive||p.owner!==owner||!legalMoves(p).some(m=>m.x===a.x&&m.y===a.y))return false;
    doMove(p,a.x,a.y);endTurn();return true;
  }
  return false;
}
function commit(a){
  if(S.mode==='online'&&NET.role==='guest'){S.busy=true;S.selected=null;render();send({type:'action',a});return}
  applyAction(S.turn,a);
}

/* ---------- online play ----------
   Phones connect directly (WebRTC through PeerJS's free broker). The host (Ivory) runs the real game and
   sends the guest (Onyx) only what Onyx may see: enemy ranks and mine positions never leave the host. */
const PEER_SRC='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
const ID_PREFIX='game-of-war-';
const CODE_CHARS='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const NET={role:null,code:null,lastCode:null,myName:'',guestName:'',tc:0};
let peer=null,conn=null,lastSent='';
function netUp(){return!!(conn&&conn.open)}
function send(m){if(netUp())try{conn.send(m)}catch(e){}}
function makeCode(){let s='';for(let i=0;i<6;i++)s+=CODE_CHARS[rnd(CODE_CHARS.length)];return s}
function peerId(code){return ID_PREFIX+code.toLowerCase()}
function loadPeer(){
  if(window.Peer)return Promise.resolve();
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src=PEER_SRC;s.onload=res;s.onerror=rej;document.head.appendChild(s)});
}
function netClose(){
  const c=conn,p=peer;conn=null;peer=null;NET.role=null;NET.code=null;lastSent='';
  try{c&&c.close()}catch(e){}
  try{p&&p.destroy()}catch(e){}
}
function netErrorText(e){
  const t=e&&e.type;
  if(t==='browser-incompatible')return'This browser does not support online play. Try Chrome or Safari.';
  if(t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed')return'Could not reach the online service. Check your internet connection and try again.';
  return'Could not connect'+(t?` (${t})`:'')+'. Try again.';
}
function netLine(){
  if(S.mode!=='online')return'';
  return`<div class="netline"><span class="dot ${netUp()?'on':'off'}"></span>Online as ${who(S.me)}${NET.code?` · room ${NET.code}`:''}${netUp()?'':' · disconnected'}</div>`;
}
function inviteUrl(code){return location.origin+location.pathname+'?join='+code}
function copyText(text,done){
  if(!text)return;
  const fallback=()=>toast(`Copy this: ${text}`,'info');
  try{navigator.clipboard.writeText(text).then(()=>toast(done,'good'),fallback)}catch(e){fallback()}
}
function shareInvite(){
  const url=inviteUrl(NET.code);
  if(navigator.share)navigator.share({title:'Game of War',text:`Join my Game of War battle. Room code: ${NET.code}`,url}).catch(()=>{});
  else copyText(url,'Invite link copied. Send it to your friend.');
}

// What one side is allowed to know.
function viewFor(o){
  const over=S.phase==='over';
  const pieces=S.pieces.filter(p=>p.alive&&(p.owner===o||S.phase!=='setup'))
    .map(p=>p.owner===o||over?{...p}:{...p,rank:null,kills:0});
  const v={mode:'online',me:o,phase:S.phase,turn:S.turn,moves:S.moves,winner:S.winner,reason:S.reason,
    names:S.names,pieces,bars:S.bars,
    tc:S.tc?{base:S.tc.base,inc:S.tc.inc,left:[tcLeft(0),tcLeft(1)],run:S.tc.since?S.turn:-1}:null,mines:over?S.mines:[],craters:S.craters,powerups:S.powerups,skills:S.skills,
    barUsed:S.barUsed,last:S.last,flagPending:S.flagPending,ready:S.ready,timeLeft:S.timeLeft,
    log:S.log.filter(e=>e.vis==='all'||e.vis===o),fallen:o===0?[S.fallen[0],[]]:[[],S.fallen[1]],
    fx:S.fx,sfx:S.sfx,puFresh:S.puFresh,toasts:S.pending[o]};
  return v;
}
function sync(force){
  if(!S||S.mode!=='online'||NET.role!=='host'||!netUp())return;
  const v=viewFor(1),s=JSON.stringify(v);
  if(!force&&s===lastSent)return;
  lastSent=s;S.pending[1]=[];
  send({type:'state',v});
}
function sendArrange(){send({type:'arrange',pos:alive(S.me).map(p=>({id:p.id,x:p.x,y:p.y}))})}

function attach(c,onOpen){
  conn=c;
  c.on('open',()=>{if(conn!==c)return;onOpen&&onOpen();onConnected()});
  c.on('data',m=>{if(conn===c)onData(m)});
  c.on('close',()=>{if(conn===c){conn=null;onClosed()}});
  c.on('error',()=>{});
}

function lobbyHtml(msg){
  return`<div class="eyebrow">Online · create</div><h2>Invite a friend</h2>
    ${NET.code?`<p>Send this code or the invite link. The battle starts as soon as your friend joins. You play Ivory and move first.</p>
    <div class="roomcode" aria-label="Room code">${NET.code}</div>
    <div class="row"><button class="btn primary" type="button" data-act="share" data-focus>Share invite link</button><button class="btn" type="button" data-act="copy">Copy code</button></div>`:''}
    <p class="netmsg">${msg}</p>
    <div class="row"><button class="btn" type="button" data-act="leave">Cancel</button></div>`;
}
async function hostGame(){
  netClose();NET.guestName='';
  overlay(lobbyHtml('Opening a room…'),false,'lobby');
  try{await loadPeer()}catch(e){return overlay(lobbyHtml('Could not reach the online service. Check your internet connection and try again.'),false,'lobby')}
  const code=makeCode(),p=new window.Peer(peerId(code),{debug:0});
  peer=p;
  p.on('open',()=>{if(peer!==p)return;NET.role='host';NET.code=code;NET.lastCode=code;overlay(lobbyHtml('Waiting for your friend to join…'),false,'lobby')});
  p.on('connection',c=>{
    if(peer!==p)return;
    if(netUp()){c.on('open',()=>{try{c.send({type:'full'})}catch(e){}setTimeout(()=>c.close(),500)});return}
    attach(c);
  });
  p.on('disconnected',()=>{if(peer===p&&!p.destroyed)try{p.reconnect()}catch(e){}});
  p.on('error',e=>{
    if(peer!==p)return;
    if(e.type==='unavailable-id')return hostGame();
    if(netUp()||S.mode==='online')return; // a broker hiccup mid-game; the direct link keeps working
    overlay(lobbyHtml(netErrorText(e)),false,'lobby');
  });
}

function showJoin(code,msg,busy){
  const name=cleanName(NET.myName||savedNames().me||'');
  overlay(`<div class="eyebrow">Online · join</div><h2>Join a game</h2>
    <p>Enter your name and the 6-character room code from your friend.</p>
    <form class="join" id="joinForm" autocomplete="off">
      <label class="namefield joinname"><span class="nlabel"><span class="chip o1"></span>Your name · you play Onyx</span>
        <input id="joinName" name="joinName" maxlength="${NAME_MAX}" spellcheck="false" placeholder="${SIDE[1]}" value="${name}" ${busy?'disabled':''}></label>
      <input id="joinCode" name="joinCode" maxlength="6" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="CODE" value="${(code||'').replace(/[^A-Z0-9]/gi,'')}" aria-label="Room code" ${busy?'disabled':''}>
      <button class="btn primary" type="submit" ${busy?'disabled':''}>Join</button>
    </form>
    <p class="netmsg">${msg||''}</p>
    <div class="row"><button class="btn" type="button" data-act="leave">Back</button></div>`,false,'join');
  if(!busy){const i=$(name&&!code?'#joinCode':'#joinName');if(i)i.focus()}
}
async function joinGame(raw,rawName){
  const code=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  NET.myName=cleanName(rawName);
  if(NET.myName)rememberNames({me:NET.myName});
  if(code.length!==6)return showJoin(code,'Enter the 6-character room code.');
  netClose();
  NET.lastCode=code;
  showJoin(code,'Connecting…',true);
  try{await loadPeer()}catch(e){return showJoin(code,'Could not reach the online service. Check your internet connection and try again.')}
  const p=new window.Peer({debug:0});
  peer=p;NET.role='guest';NET.code=code;
  const timer=setTimeout(()=>{if(peer===p&&!netUp()){netClose();showJoin(code,'No answer from that room. Check the code, and make sure your friend still has the invite screen open.')}},20000);
  p.on('open',()=>{if(peer!==p)return;attach(p.connect(peerId(code),{reliable:true,serialization:'json'}),()=>clearTimeout(timer))});
  p.on('disconnected',()=>{if(peer===p&&!p.destroyed)try{p.reconnect()}catch(e){}});
  p.on('error',e=>{
    if(peer!==p||netUp())return;
    clearTimeout(timer);netClose();
    showJoin(code,e.type==='peer-unavailable'?`No open room with code ${code}. Check the code with your friend.`:netErrorText(e));
  });
}

function onConnected(){
  lastSent='';
  if(NET.role==='host'){
    if(S.mode==='online'&&(S.phase==='setup'||S.phase==='play')){closeNetOverlay();toast(`${who(1)} reconnected.`,'good');render();sync(true)}
    else newOnlineGame();
  }else{
    send({type:'hello',name:NET.myName});
    if(!(S.mode==='online'&&S.phase!=='menu'))showJoin(NET.code,'Connected. Waiting for the host to start…',true);
  }
}
function onClosed(){
  if(S.mode!=='online'){if(NET.role==='guest'){netClose();showJoin(NET.lastCode,'The connection closed before the game started. Try again.')}return}
  render();
  if(S.phase==='over'){toast('Your opponent left the game.','info');return}
  if(NET.role==='host'){
    overlay(`<div class="eyebrow">Connection lost</div><h2>${who(1)} disconnected</h2>
      <p>The game is paused. Your friend can rejoin with room code <b class="code-inline">${NET.code}</b> or the same invite link.</p>
      <div class="row"><button class="btn" type="button" data-act="share">Share invite link again</button><button class="btn" type="button" data-act="leave">Leave game</button></div>`,false,'lost');
  }else{
    overlay(`<div class="eyebrow">Connection lost</div><h2>Lost the host</h2>
      <p>The host may have closed the app or lost signal. The game continues where it stopped if they still have it open.</p>
      <div class="row"><button class="btn primary" type="button" data-act="rejoin" data-focus>Reconnect</button><button class="btn" type="button" data-act="leave">Leave game</button></div>`,false,'lost');
  }
}
function onData(m){
  if(!m||typeof m!=='object')return;
  if(NET.role==='host'){
    if(S.mode!=='online')return;
    if(m.type==='action'){if(!applyAction(1,m.a))sync(true)}
    else if(m.type==='arrange')hostArrange(m.pos);
    else if(m.type==='ready'){if(S.phase==='setup'&&!S.ready[1])markReady(1)}
    else if(m.type==='surrender'){if(S.phase==='play')surrender(1)}
    else if(m.type==='emote')receiveEmote(1,m.i);
    else if(m.type==='rematch'){if(S.phase==='over'){toast(`${who(1)} started a rematch.`,'info');newOnlineGame()}}
    else if(m.type==='hello'){
      const name=cleanName(m.name);
      if(name&&name!==NET.guestName){NET.guestName=name;S.names[1]=name;toast(`${name} is in the room.`,'good');render()}
      sync(true);
    }
  }else{
    if(m.type==='state')guestState(m.v);
    else if(m.type==='tick'){if(S.mode==='online'&&S.phase==='setup'){S.timeLeft=m.t;tickClock()}}
    else if(m.type==='full'){netClose();showJoin(NET.lastCode,'That game already has two players.')}
    else if(m.type==='emote')receiveEmote(0,m.i);
  }
}
function hostArrange(pos){
  if(S.phase!=='setup'||S.ready[1]||!Array.isArray(pos))return;
  const mine=alive(1);if(pos.length!==mine.length)return;
  const seen=new Set();
  for(const q of pos){
    const p=q&&getPiece(q.id);
    if(!p||p.owner!==1||!Number.isInteger(q.x)||q.x<0||q.x>=N||!homeRows(1).includes(q.y)||seen.has(key(q.x,q.y)))return;
    seen.add(key(q.x,q.y));
  }
  pos.forEach(q=>{const p=getPiece(q.id);p.x=q.x;p.y=q.y});
}
function newOnlineGame(){
  if(S)clearInterval(S.timer);
  S=freshState('online');S.me=0;
  S.names=[NET.myName||SIDE[0],NET.guestName||SIDE[1]];
  S.tc=makeClock(NET.tc||0);
  EMO.open=false;
  formation(0);formation(1);
  closeOverlay();
  beginSetup(0);
  toast(`${NET.guestName||'Your friend'} joined. Deploy your army; you share one 90-second clock.`,'good');
}
function guestState(v){
  const prev=S;
  const wasOnline=prev&&prev.mode==='online';
  const next={...freshState('online'),...v,busy:false,timer:null};
  next.names=[0,1].map(i=>cleanName(v.names&&v.names[i])||SIDE[i]);
  // The host's clock is official; count down locally from the time it reported.
  next.tc=v.tc&&Array.isArray(v.tc.left)?{base:+v.tc.base,inc:+v.tc.inc,left:v.tc.left.map(Number),since:v.tc.run>=0?Date.now():null}:null;
  // A queued pre-move survives state updates; it fires when the turn comes to us.
  if(wasOnline&&prev.premove&&v.phase==='play')next.premove=prev.premove;
  const myTurnNow=v.phase==='play'&&v.turn===next.me&&!(wasOnline&&prev.phase==='play'&&prev.turn===next.me);
  if(wasOnline&&prev.phase===v.phase&&prev.turn===v.turn&&prev.moves===v.moves){next.selected=prev.selected;next.tool=prev.tool;next.preview=prev.preview}
  if(wasOnline&&prev.phase==='setup'&&v.phase==='setup'){next.pieces=prev.pieces;next.ready=[v.ready[0],prev.ready[1]||v.ready[1]]}
  S=next;
  closeNetOverlay();
  if(!wasOnline||prev.phase!==v.phase){
    if(v.phase==='setup'){closeOverlay();toast('You play Onyx. Deploy your army; you share one 90-second clock.','info')}
    else if(v.phase==='play'){closeOverlay();toast(`Battle begins. ${who(0)} moves first.`,'info')}
    else if(v.phase==='over')setTimeout(showOver,1000);
  }
  (v.toasts||[]).forEach(t=>toast(t.text,t.kind));
  render();
  if(myTurnNow)schedulePremove();
}
function leaveOnline(){
  netClose();
  if(S.mode!=='online'){showMenu();return}
  clearInterval(S.timer);
  S=freshState('ai');formation(0);formation(1);S.phase='menu';
  render();showMenu();
}

$('#card').addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='joinForm')joinGame($('#joinCode').value,$('#joinName').value);
  else if(e.target.id==='namesForm')submitNames(e.target);
});
$('#card').addEventListener('input',e=>{if(e.target.id==='joinCode')e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'')});

/* Opening view: a sample deployment behind the menu, or straight into a join from an invite link */
S=freshState('ai');formation(0);formation(1);
render();
const invite=new URLSearchParams(location.search).get('join');
if(invite){history.replaceState(null,'',location.pathname);showJoin(invite,'Enter your name, then tap Join.')}
else showMenu();
})();
